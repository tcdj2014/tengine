name: Tengine

on:
    workflow_dispatch:
    # 只匹配标签推送：push 分支不会触发，推任意标签都会构建。
    # 注意不要在这里再加 paths：tags 与 paths 同时存在时两者必须同时满足，
    # 而推标签通常没有文件变更，会导致永远不触发
    push:
        tags:
            - '*'


env:
    ALIYUN_REGISTRY: "${{ vars.ALIYUN_REGISTRY }}"
    ALIYUN_NAME_SPACE: "${{ vars.ALIYUN_NAME_SPACE }}"
    ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
    ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            -   name: Before freeing up disk space
                run: |
                    echo "Before freeing up disk space"
                    echo "=============================================================================="
                    df -hT
                    echo "=============================================================================="

            # 增加可用磁盘空间：只删除用不到的组件，不缩小根分区。
            # 新版 ubuntu-latest 的 Docker 使用 containerd 镜像存储，镜像层解压在
            # /var/lib/containerd（位于根分区），根分区太小会导致
            # "ERROR: failed to extract layer ... no space left on device"
            -   name: Free up disk space
                run: |
                    sudo rm -rf /usr/share/dotnet \
                                /usr/local/lib/android \
                                /opt/ghc \
                                /opt/hostedtoolcache/CodeQL \
                                /usr/local/share/boost
                    sudo docker system prune -af --volumes || true

            -   name: Free up disk space complete
                run: |
                    echo "Free up disk space complete"
                    echo "=============================================================================="
                    df -hT
                    echo "=============================================================================="

            -   name: Checkout Code
                uses: actions/checkout@v4

            -   name: Set up QEMU
                uses: docker/setup-qemu-action@v3

            -   name: Docker Setup Buildx
                uses: docker/setup-buildx-action@v3

            -   name: Set the value
                id: step_one
                run: |
                    tag=$(echo "${{ github.ref }}" | sed -e "s,.*/\(.*\),\1,")
                    echo "TAG_VERSION=$tag" >> "$GITHUB_ENV"

            -   name: Use the value
                id: step_two
                run: |
                    printf 'TAG是%s\n' "$TAG_VERSION" # This will output TAG_VERSION

            # 推 tag 时 tag 名直接作为 tengine 版本号（如 3.2.0-rc6），
            # 不再区分长短 tag；手动触发没有版本号，仍编译上游最新正式 release。
            -   name: Resolve tengine source version
                id: source_version
                run: |
                    version=""
                    if [ "${{ github.ref_type }}" = "tag" ]; then
                        version="$TAG_VERSION"
                    fi

                    # tag 即源码版本，必须在上游存在，否则终止构建
                    if [ -n "$version" ]; then
                        status=$(curl -s -o /dev/null -w '%{http_code}' \
                            "https://api.github.com/repos/alibaba/tengine/git/ref/tags/$version")
                        if [ "$status" = "404" ]; then
                            echo "::error::上游不存在 tengine 版本 tag: $version"
                            exit 1
                        elif [ "$status" != "200" ]; then
                            echo "::error::校验 tengine 版本 tag 失败: $version (HTTP $status)"
                            exit 1
                        fi
                    fi

                    echo "TENGINE_VERSION=$version" >> "$GITHUB_ENV"
                    printf 'tengine 源码版本: %s\n' "${version:-上游最新正式 release}"

            # 只有 tag 与上游最新正式 release 一致时才推送 latest；
            # 其余 tag（含 prerelease）只推送 tengine:<tag>。
            -   name: Compute image tags
                id: image_tags
                run: |
                    repo="${ALIYUN_REGISTRY}/${ALIYUN_NAME_SPACE}/tengine"
                    latest=$(curl -fsSL "https://api.github.com/repos/alibaba/tengine/releases/latest" \
                        | grep '"tag_name"' | head -n 1 \
                        | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/')
                    tags="${repo}:${TAG_VERSION}"
                    if [ "$TAG_VERSION" = "$latest" ]; then
                        tags="${repo}:latest,${tags}"
                    fi
                    echo "tags=$tags" >> "$GITHUB_OUTPUT"
                    printf '上游最新正式 release: %s\n镜像标签: %s\n' "$latest" "$tags"

            -   name: Login to DockerHub
                uses: docker/login-action@v3
                with:
                    registry: ${{ vars.ALIYUN_REGISTRY }}
                    username: ${{ secrets.ALIYUN_REGISTRY_USER }}
                    password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

            -   name: Build and push tengine base
                uses: docker/build-push-action@v6
                with:
                    file: Dockerfile
                    context: .
                    # 空值 = install.sh 取上游最新正式 release
                    build-args: |
                        TENGINE_VERSION=${{ env.TENGINE_VERSION }}
                    # platforms: linux/amd64,linux/arm64
                    platforms: linux/amd64
                    push: true
                    # 阿里云 ACR 不认识 buildx 默认附带的 provenance 证明清单
                    # （manifest list 里会出现 application/vnd.oci.empty.v1+json，
                    #  推送时报 denied: unknown manifest class for application/vnd.oci.empty.v1+json）
                    provenance: false
                    sbom: false
                    tags: ${{ steps.image_tags.outputs.tags }}
